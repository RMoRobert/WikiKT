# Example simple of home/self-hosted stack: WikiKT + PostgreSQL (no Caddy; recommend behind own reverse proxy,
# or see docker-compose.prod.yml for a full-featured production stack).
# Add TLS yourself (recommended) with your own reverse proxy, or run plain HTTP on a trusted LAN (not recommended but
# may be useful for testing or simple home LAN deployment).
#
#   Two ways to supply the values below (passwords, keys, public URL):
#     A) .env file (command-line): copy .env.home.example -> .env, fill it in, chmod 600 .env.
#        The ${VAR:?...} placeholders read from this; a missing value will fail to start and note this.
#     B) Inline (Portainer web editor or similar, no .env): replace each ${VAR:?...} with a
#        literal value. The `# inline:` comments show example values. (Be sure to keep this file
#        private, out of source control, etc., if using this method.)
#   Start:      docker compose -f docker-compose.home.yml up -d --build
#   Logs:       docker compose -f docker-compose.home.yml logs -f wikikt
#   Upgrade:    docker compose -f docker-compose.home.yml up -d --build
#
# Two things differ from docker-compose.prod.yml: no `caddy` service as part of stack, and app
# publishes a host port (`ports:`) so your own proxy or a browser on the LAN can reach it.

# The DB password is needed by both the postgres service and the wikikt app. It is defined once
# here and aliased (*db_password) into both, so there is only one place to set it.
#   Option A (.env):  leave as-is; value comes from POSTGRES_PASSWORD in your .env.
#   Option B (inline): replace the ${...} with a literal, e.g. &db_password "my-strong-password".
x-db-password: &db_password "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}"

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: wikikt
      POSTGRES_PASSWORD: *db_password
      POSTGRES_DB: wikikt
    volumes:
      # PostgreSQL 18+ image keeps its data in a version subdir, so mount the PARENT
      # (/var/lib/postgresql), not /var/lib/postgresql/data — the old path makes PG18 refuse to start.
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wikikt"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  wikikt:
    build: .
    # --- Ship a prebuilt image instead of building on this box (docker save | docker load) ---
    # Comment out `build: .` above and uncomment the next line. Build it on your workstation with:
    #   docker buildx build --platform linux/amd64 -t wikikt:latest --load .   # --platform: Mac->x86 host
    #   docker save wikikt:latest | gzip | ssh user@homebox 'gunzip | docker load'
    # image: wikikt:latest
    # --- ...or pull a prebuilt image from the GitHub Container Registry (no build on this box) ---
    # Comment out `build: .` above, uncomment the next line, and start without --build.
    # image: ghcr.io/rmorobert/wikikt:latest
    # Pass the whole .env through to the app, so any WIKIKT_* setting from the reference table in
    # docs/install.md can be set there without editing this file. The `environment:` block below still
    # wins for anything it names, so the settings pinned here can't be weakened from .env.
    env_file:
      - path: .env
        required: false
    environment:
      WIKIKT_ENV: production
      WIKIKT_ADMIN_PASSWORD: ${WIKIKT_ADMIN_PASSWORD:?set WIKIKT_ADMIN_PASSWORD in .env}
      # inline (B): WIKIKT_ADMIN_PASSWORD: "your-admin-password"   (must not be or start with "changeme")
      # Both session keys are required in production (hex; see .env.home.example to generate).
      WIKIKT_SESSION_ENCRYPTION_KEY: ${WIKIKT_SESSION_ENCRYPTION_KEY:?set WIKIKT_SESSION_ENCRYPTION_KEY in .env}
      WIKIKT_SESSION_SIGN_KEY: ${WIKIKT_SESSION_SIGN_KEY:?set WIKIKT_SESSION_SIGN_KEY in .env}
      # inline (B): paste hex from `openssl rand -hex 16` (encryption) and `openssl rand -hex 32` (sign):
      #   WIKIKT_SESSION_ENCRYPTION_KEY: "<32 hex chars>"
      #   WIKIKT_SESSION_SIGN_KEY: "<64 hex chars>"
      # Encrypts stored MFA (TOTP) secrets at rest; required in production (32-byte hex, like the sign key).
      WIKIKT_MFA_KEY: ${WIKIKT_MFA_KEY:?set WIKIKT_MFA_KEY in .env}
      # inline (B): WIKIKT_MFA_KEY: "<64 hex chars from `openssl rand -hex 32`>"

      # --- Database: PostgreSQL (active) -----------------------------------------------------
      WIKIKT_DATABASE_TYPE: postgres
      WIKIKT_DATABASE_R2DBC_URL: r2dbc:postgresql://postgres:5432/wikikt
      WIKIKT_DATABASE_USERNAME: wikikt
      WIKIKT_DATABASE_PASSWORD: *db_password   # As defined for Postgres
      # --- Database: H2 instead of PostgreSQL (ALTERNATIVE) ----------------------------------
      # H2 is a simple built-in option and lives in the wikikt_data volume (/app/data/wikikt.mv.db).
      # To use it: (1) delete the four WIKIKT_DATABASE_* lines above, (2) delete the `postgres`
      # service (top of this file) and the `postgres_data` volume (bottom), and (3) delete the
      # `depends_on:` block below. Nothing else to set; H2 needs no URL, user, or password. Not
      # recommended for production deployments but may be OK for single-user setups and testing.

      # --- TLS posture: Run production behind your own HTTPS reverse proxy ---------------
      # Assumes something in front terminates TLS (nginx/Caddy/etc.) with a real or
      # self-signed cert. Production mode requires a Secure cookie, so it will
      # refuse to boot without TLS in front.
      WIKIKT_TRUST_PROXY: "true"           # honor X-Forwarded-* from the proxy
      WIKIKT_SESSION_SECURE_COOKIE: "true" # cookie never sent over plain HTTP
      WIKIKT_PUBLIC_URL: ${WIKIKT_PUBLIC_URL:?set WIKIKT_PUBLIC_URL in .env, e.g. https://wiki.home.lan}
      # inline (B): WIKIKT_PUBLIC_URL: "https://wiki.home.lan"
      # --- TLS posture: plain HTTP on a trusted LAN, no TLS (DEV ALTERNATIVE) -----------------
      # Production won't run without TLS, so drop to development mode. It only WARNS on insecure
      # defaults instead of failing, so keep ADMIN_PASSWORD + both session keys set above.
      # Replace the WIKIKT_ENV line at the top and the three TLS lines above with:
      #   WIKIKT_ENV: development
      #   WIKIKT_TRUST_PROXY: "false"            # directly exposed: must NOT trust X-Forwarded-For
      #   WIKIKT_SESSION_SECURE_COOKIE: "false"  # allow the cookie over plain HTTP
      #   WIKIKT_PUBLIC_URL: "http://192.168.1.50:8080"   # only affects outbound-email links

      # Asset delivery:
      # Where frontend libraries and webfonts load from: "cdn" (default) or "local" (to serve the copies
      # bundled in the image). Set all three in .env for a fully local install; see docs/install.md ("Asset delivery").
      WIKIKT_UI_ASSET_SOURCE: ${WIKIKT_UI_ASSET_SOURCE:-cdn}             # Bootstrap, highlight.js (~440KB)
      WIKIKT_UI_ICON_FONT_SOURCE: ${WIKIKT_UI_ICON_FONT_SOURCE:-cdn}     # icons (~750KB); if unavailable, gaps in UI
      WIKIKT_UI_EMOJI_FONT_SOURCE: ${WIKIKT_UI_EMOJI_FONT_SOURCE:-cdn}   # emoji font (~2MB); if unavailable, uses OS emoji
      # inline (B): set the literal value, e.g. WIKIKT_UI_ASSET_SOURCE: "local"
      # Self-update handshake with the optional wikikt-updater service (see it below). Inert unless
      # that service is enabled via `--profile selfupdate` (which also needs the GHCR `image:`
      # alternative above -- a `build: .` service has nothing to pull).
      WIKIKT_UPDATE_REQUEST_DIR: /app/update/req
      WIKIKT_UPDATE_STATE_DIR: /app/update/state
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      # Uploaded assets, git-sync working clone (if Git Sync enabled), and H2 DB file (if using H2):
      - wikikt_data:/app/data
      # Self-update handshake volumes, one per direction (app writes requests and reads state; the
      # updater mounts them the other way around). Empty and harmless while the profile is off.
      - wikikt_update_req:/app/update/req
      - wikikt_update_state:/app/update/state:ro
    ports:
      # Exposes the app on the host. If your reverse proxy runs on this same host, harden it to
      # loopback only: "127.0.0.1:8080:8080". Left open so a proxy (or browser) on another LAN
      # machine can reach it. Change first number to move the host port (e.g. "9000:8080").
      - "8080:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3

  # Optional one-click updates from Administration > Updates. Suggested if you use the GHCR
  # `image:` alternative above (and requires it: `build: .` has nothing to pull). Off by default to
  # stay offline-friendly; enable persistently by uncommenting COMPOSE_PROFILES=selfupdate in .env
  # (see .env.home.example), or one-off with:
  #   docker compose -f docker-compose.home.yml --profile selfupdate up -d
  # TRUST NOTE: holds /var/run/docker.sock (root-equivalent on the host). This is why it is
  # a separate, opt-in container and the app never gets the socket. See docker/README.md
  # ("One-click updates") for the details and WIKIKT_COMPOSE_DIR requirement.
  wikikt-updater:
    profiles: ["selfupdate"]
    image: ghcr.io/rmorobert/wikikt-updater:latest
    restart: unless-stopped
    network_mode: none
    security_opt: ["no-new-privileges:true"]
    environment:
      # MUST be the absolute host path of the directory holding this compose file (compose run inside
      # a container resolves relative bind-mount sources against the *host* filesystem). The default
      # matches the docs' recommended install location; set it in .env if you cloned elsewhere.
      WIKIKT_COMPOSE_DIR: ${WIKIKT_COMPOSE_DIR:-/opt/wikikt}
      # inline (B): WIKIKT_COMPOSE_DIR: "/opt/wikikt"
      WIKIKT_SERVICE: wikikt
      # The service the updater runs `pg_dump` inside for its automatic pre-update backup -- i.e. the
      # `postgres` service at the top of this file. If you took the H2 alternative above and deleted
      # that service, no service by this name exists, so there is no automatic backup. On H2, take
      # a full backup yourself (Administration > Backup > full export) before installing an update.
      WIKIKT_DB_SERVICE: postgres
      WIKIKT_HEALTH_TIMEOUT: "180"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${WIKIKT_COMPOSE_DIR:-/opt/wikikt}:${WIKIKT_COMPOSE_DIR:-/opt/wikikt}:ro
      - wikikt_update_req:/req:ro
      - wikikt_update_state:/state

volumes:
  postgres_data:   # delete this line if you switch to H2
  wikikt_data:
  wikikt_update_req:
  wikikt_update_state:
