# Production example: WikiKT + PostgreSQL + Caddy reverse proxy with automatic HTTPS (Let's Encrypt).
# Configure via a .env file next to this compose file; see docker/README.md for template.
# Example usage: docker compose -f docker-compose.prod.yml up -d
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: wikikt
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: wikikt
    volumes:
      # PostgreSQL 18+ image keeps its data in a version subdir, so mount the PARENT
      # (/var/lib/postgresql), not /var/lib/postgresql/data — the old path makes PG18 refuse to start.
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wikikt"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  wikikt:
    # Pulls the prebuilt app image from the GitHub Container Registry -- no JDK, Gradle, or build
    # memory needed on this server. `latest` is the newest release; pin a specific version by
    # replacing it (e.g. :1.2.0). See docker/README.md ("Pull a prebuilt image from GHCR") for tags.
    image: ghcr.io/rmorobert/wikikt:latest
    # ...or compile WikiKT from this checkout instead (needs far more memory than running it does):
    # comment out the `image:` line above, uncomment `build: .` below, and start with `--build`.
    # build: .
    # Pass the whole .env through to the app, so any WIKIKT_* setting from the reference table in
    # docs/install.md can be set there without editing this file. The `environment:` block below still
    # wins for anything it names -- the hardened settings (production mode, TLS posture, the database
    # wiring) cannot be weakened from .env.
    env_file:
      - path: .env
        required: false
    environment:
      WIKIKT_ENV: production
      WIKIKT_DATABASE_TYPE: postgres
      WIKIKT_DATABASE_R2DBC_URL: r2dbc:postgresql://postgres:5432/wikikt
      WIKIKT_DATABASE_USERNAME: wikikt
      WIKIKT_DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      # Both session keys required in production mode (see docker/README.md for how to generate hex format keys for this).
      WIKIKT_SESSION_ENCRYPTION_KEY: ${WIKIKT_SESSION_ENCRYPTION_KEY:?set WIKIKT_SESSION_ENCRYPTION_KEY in .env}
      WIKIKT_SESSION_SIGN_KEY: ${WIKIKT_SESSION_SIGN_KEY:?set WIKIKT_SESSION_SIGN_KEY in .env}
      # Dedicated key that encrypts stored MFA (TOTP) secrets at rest; required in production. Generate a
      # random 32-byte hex value the same way as the session keys (see docker/README.md).
      WIKIKT_MFA_KEY: ${WIKIKT_MFA_KEY:?set WIKIKT_MFA_KEY in .env}
      WIKIKT_ADMIN_PASSWORD: ${WIKIKT_ADMIN_PASSWORD:?set WIKIKT_ADMIN_PASSWORD in .env}
      # Caddy terminates TLS in front of this; honor X-Forwarded-* and mark cookie secure.
      WIKIKT_TRUST_PROXY: "true"
      WIKIKT_SESSION_SECURE_COOKIE: "true"
      # Canonical public URL for links placed in outbound email (password reset, welcome). Defaults to
      # the domain Caddy serves, so those links never trust a client-supplied Host header. Set
      # WIKIKT_PUBLIC_URL in .env to override (e.g. a non-standard port or a path prefix).
      WIKIKT_PUBLIC_URL: ${WIKIKT_PUBLIC_URL:-https://${WIKIKT_DOMAIN}}
      # Asset delivery:
      # Where frontend libraries and webfonts load from: "cdn" (default) or "local" (to serve the copies
      # bundled in the image). Set all three in .env for a fully local install; see docs/install.md ("Asset delivery").
      WIKIKT_UI_ASSET_SOURCE: ${WIKIKT_UI_ASSET_SOURCE:-cdn}             # Bootstrap, highlight.js (~440KB)
      WIKIKT_UI_ICON_FONT_SOURCE: ${WIKIKT_UI_ICON_FONT_SOURCE:-cdn}     # icons (~750KB); if unavailable, gaps in UI
      WIKIKT_UI_EMOJI_FONT_SOURCE: ${WIKIKT_UI_EMOJI_FONT_SOURCE:-cdn}   # emoji font (~2MB); if unavailable, uses OS emoji
      # inline (B): set the literal value, e.g. WIKIKT_UI_ASSET_SOURCE: "local"
      # Self-update handshake with the optional wikikt-updater service (see that below). Inert unless
      # that service is enabled via `--profile selfupdate`.
      WIKIKT_UPDATE_REQUEST_DIR: /app/update/req
      WIKIKT_UPDATE_STATE_DIR: /app/update/state
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      # Uploaded assets + the git-sync working clone if Git sync enabled (note: database itself lives in postgres_data)
      - wikikt_data:/app/data
      # Self-update handshake volumes, one per direction — the app can only *write* the request and
      # only *read* the updater's status/heartbeat, enforced by these mounts (the updater mounts them
      # the other way around). Two empty volumes cost nothing when the updater profile is off, and
      # keeping them unconditional means enabling self-update never recreates the app container.
      - wikikt_update_req:/app/update/req
      - wikikt_update_state:/app/update/state:ro
    expose:
      - "8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3

  # One-click updates from Administration > Updates. Runs by default when .env carries
  # COMPOSE_PROFILES=selfupdate — which the shipped .env.example does — so a standard install gets
  # the Install update button out of the box. For an offline / no-socket deployment, comment that
  # line out of .env (or run without it): the profile then never activates and nothing else changes.
  # One-off alternative: docker compose -f docker-compose.prod.yml --profile selfupdate up -d
  #
  # TRUST NOTE: this container holds /var/run/docker.sock, which is root-equivalent on the host.
  # That is why it is a separate container and the WikiKT app itself never gets the socket.
  # The app can only ring a "doorbell" file; the updater decides everything else from its own
  # environment, the compose file, and image labels. See docker/README.md ("One-click updates").
  wikikt-updater:
    profiles: ["selfupdate"]
    image: ghcr.io/rmorobert/wikikt-updater:latest
    restart: unless-stopped
    # `docker compose pull` is executed by the host's Docker daemon via the socket, so this container
    # needs no network of its own; every guardrail is read from image labels, offline.
    network_mode: none
    security_opt: ["no-new-privileges:true"]
    environment:
      # Must be the absolute host path of the directory holding this compose file. `docker compose`
      # run inside a container resolves relative bind-mount sources (like ./docker/Caddyfile above)
      # against the *host* filesystem, so  project must be visible at its own host path (or `up -d`
      # would silently assemble a different stack). The default matches the install location the docs
      # recommend (docs/install.md clones to /opt/wikikt); set WIKIKT_COMPOSE_DIR in .env if yours differs.
      WIKIKT_COMPOSE_DIR: ${WIKIKT_COMPOSE_DIR:-/opt/wikikt}
      WIKIKT_SERVICE: wikikt
      WIKIKT_DB_SERVICE: postgres
      WIKIKT_HEALTH_TIMEOUT: "180"
    volumes:
      # Root-equivalent on the host; enabling this profile is a deliberate trust decision.
      - /var/run/docker.sock:/var/run/docker.sock
      - ${WIKIKT_COMPOSE_DIR:-/opt/wikikt}:${WIKIKT_COMPOSE_DIR:-/opt/wikikt}:ro
      - wikikt_update_req:/req:ro
      - wikikt_update_state:/state

  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      WIKIKT_DOMAIN: ${WIKIKT_DOMAIN:?set WIKIKT_DOMAIN in .env}
      # Optional: additional site hostnames (space-separated). Caddy gets a cert for each and routes
      # them to WikiKT. Each needs its own DNS record; each site must also exist in Admin > Sites.
      WIKIKT_EXTRA_DOMAINS: ${WIKIKT_EXTRA_DOMAINS:-}
    depends_on:
      - wikikt
    restart: unless-stopped

volumes:
  postgres_data:
  wikikt_data:
  caddy_data:
  caddy_config:
  wikikt_update_req:
  wikikt_update_state:
